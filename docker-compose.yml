services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextep-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_DEBUG=True
      - CORS_ALLOWED_ORIGINS=http://localhost:5173
      # Variables para la API de tasas de cambio (VES - Bolívares)
      - LOCAL_CURRENCY=VES
      - DEFAULT_EXCHANGE_RATE=854.46
      - PROFIT_MARGIN=0.40

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextep-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evita sobreescribir los módulos instalados en el contenedor
    environment:
      - CHOKIDAR_USEPOLLING=true # Ayuda al hot-reload en Windows
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
